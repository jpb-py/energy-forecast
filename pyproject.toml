[project]
name = "energy-forecast"
version = "0.1.0"
description = "Battery dispatch optimisation against a UK electricity demand forecast"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.69.0",
    "arviz>=0.22.0",
    "cvxpy>=1.9.2",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.9",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pymc>=5.26.0",
    "pyomo>=6.10.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "statsmodels>=0.14.6",
    "xgboost>=3.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_forecast"]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
